# Horizontal Pod Autoscaler on CPU and request rate
#
# Vera Cree  |  Candidate 240301062  |  CIPS Centre DC2401845

# ---------------- HORIZONTAL POD AUTOSCALER (SCALABLE) ----------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skyforge-api
  namespace: production
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: skyforge-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Pods
      pods:
        metric: { name: http_requests_per_second }
        target: { type: AverageValue, averageValue: "500" }
  behavior:
    scaleDown:                              # damp flapping
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 50, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
