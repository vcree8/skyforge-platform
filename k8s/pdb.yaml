# ---------------- POD DISRUPTION BUDGET (HIGHLY AVAILABLE) ----------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: skyforge-api
  namespace: production
spec:
  minAvailable: 2                           # node patching cannot drop below 2
  selector:
    matchLabels: { app: skyforge-api }
