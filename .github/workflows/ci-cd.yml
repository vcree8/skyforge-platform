# Unit 4 - Cloud Computing and DevOps  -  OTHM K/650/7997
# Artefact P4.2   Assessment criteria: AC 1.1, 1.3, 1.4
# CI/CD pipeline - build, test, scan, deploy (GitHub Actions)
# 
# Vera Cree  |  Candidate 240301062  |  CIPS Centre DC2401845

name: skyforge-ci-cd
on:
  push:     { branches: [main] }
  pull_request: { branches: [main] }

env:
  AWS_REGION: eu-west-2
  ECR_REPO:   skyforge/platform
  CLUSTER:    skyforge-eks-prod

jobs:
  # ---------- STAGE 1: BUILD ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history for versioning
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Compile and package
        run: mvn -B clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with: { name: jar, path: target/*.jar }

  # ---------- STAGE 2: TEST ----------
  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Unit and integration tests
        run: mvn -B verify
      - name: Enforce coverage gate (fails under 80%)
        run: mvn jacoco:check -Djacoco.haltOnFailure=true

  # ---------- STAGE 3: SECURITY SCANNING ----------
  security:
    runs-on: ubuntu-latest
    needs: build
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@v4
      - name: SAST - Semgrep
        run: semgrep --config p/owasp-top-ten --sarif -o semgrep.sarif .
      - name: SCA - dependency vulnerabilities
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Secret scanning
        run: gitleaks detect --source . --redact
      - name: IaC scanning
        run: tfsec ./terraform --soft-fail=false
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

  # ---------- STAGE 4: CONTAINER BUILD + IMAGE SCAN ----------
  image:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions: { id-token: write, contents: read }
    # Declared so that the deploy job can read the exact tag that was built
    # and signed, rather than recomputing it and risking a mismatch.
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:                                  # OIDC - no long-lived AWS keys
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build image
        id: build
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker build -f docker/Dockerfile -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"   # consumed by the deploy job
          echo "IMAGE=$IMAGE"  >> "$GITHUB_ENV"     # consumed by later steps here
      - name: Scan image - fail on HIGH or CRITICAL
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
      - name: Generate SBOM
        run: trivy image --format cyclonedx -o sbom.json "$IMAGE"
      - name: Push and sign
        run: |
          docker push "$IMAGE"
          cosign sign --yes "$IMAGE"

  # ---------- STAGE 5: DEPLOY TO CLOUD ----------
  deploy:
    runs-on: ubuntu-latest
    needs: image
    environment:
      name: production                     # requires manual approval
      url: https://platform.skyforge.io
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Rolling deploy
        run: |
          kubectl set image deployment/skyforge-api \
            api=${{ needs.image.outputs.image }} -n production
          kubectl rollout status deployment/skyforge-api -n production --timeout=5m
      - name: Smoke test, roll back on failure
        run: |
          if ! curl -fsS --retry 5 --retry-delay 10 https://platform.skyforge.io/health; then
            kubectl rollout undo deployment/skyforge-api -n production
            exit 1
          fi
